spring.application.name=ddoksi

# 로컬 개발용 .env 를 설정으로 읽어들인다. 파일이 없어도 기동에 실패하지 않는다(optional).
# .env 는 gitignore 대상이며 실제 인증키가 들어 있다.
spring.config.import=optional:file:./.env[.properties]

# --- DataSource -------------------------------------------------------------
# 값은 환경변수로 주입한다. 괄호 뒤 기본값은 로컬 개발용이며, 운영에서는 반드시 환경변수를 설정한다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ddoksi}
spring.datasource.username=${DB_USERNAME:ddoksi}
spring.datasource.password=${DB_PASSWORD:ddoksi}

# --- Flyway -----------------------------------------------------------------
# 애플리케이션 기동 시 db/migration 의 SQL 을 순서대로 적용한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 이미 테이블이 있는 DB 에 뒤늦게 붙이는 상황을 자동 통과시키지 않는다.
# 스키마 상태를 모른 채 마이그레이션이 얹히는 것을 막기 위함이다.
spring.flyway.baseline-on-migrate=false

# --- JPA --------------------------------------------------------------------
# 스키마는 Flyway 가 관리하므로 Hibernate 는 생성/변경하지 않고 검증만 한다.
# update 로 두면 로컬과 운영 스키마가 조용히 갈라지고, 컬럼 삭제/타입 변경이 반영되지 않는다.
spring.jpa.hibernate.ddl-auto=validate
# 뷰 렌더링 시점까지 영속성 컨텍스트를 열어두지 않는다 (커넥션 점유 시간 단축)
spring.jpa.open-in-view=false

# --- 국회 Open API ------------------------------------------------------------
assembly.api.key=${ASSEMBLY_API_KEY:}
assembly.api.base-url=https://open.assembly.go.kr/portal/openapi
# ⚠️ 앞단 WAF 가 curl 계열 UA 와 빈 UA 를 HTTP 400 으로 막는다. 반드시 채워야 한다.
# 브라우저를 사칭할 이유는 없다. 그 외 UA 는 모두 통과하므로 봇 정체를 밝히고,
# 문제가 생겼을 때 API 운영자가 연락할 수 있도록 저장소 주소를 남긴다.
assembly.api.user-agent=ddoksi-collector/1.0 (+https://github.com/Heo-Yoon-5025/DdokSi)
assembly.api.connect-timeout=5s
assembly.api.read-timeout=30s
assembly.api.page-size=100
# 호출 한도를 확인하기 전까지는 보수적으로 간격을 둔다. 공공 API 에서 차단되면 복구가 오래 걸린다.
assembly.api.request-delay=300ms

# --- 수집 배치 ----------------------------------------------------------------
ddoksi.collection.assembly-age=22
# 기본 비활성. 켜두면 테스트나 로컬 기동만으로도 1만9천 건을 긁어온다.
ddoksi.collection.scheduled.enabled=false
# 매일 03:30 (국회 데이터가 갱신될 시간을 지나 새벽에 돈다)
ddoksi.collection.scheduled.cron=0 30 3 * * *
# 기동 시 전체 백필. 기본 비활성 — 켜두면 재시작마다 전체를 다시 훑는다.
ddoksi.collection.backfill.enabled=false
# 제안이유 정기 수집 시각. 목록 수집(03:30)이 끝난 뒤에 돌려야
# 그날 새로 들어온 법안의 본문까지 이어서 받을 수 있다.
ddoksi.collection.scheduled.summary-cron=0 0 4 * * *
# 정기 실행 1회당 채울 제안이유 상한. 법안 1건당 API 1회라 상한이 없으면 배치가 길어진다.
ddoksi.collection.scheduled.summary-max-bills=500

# 제안이유 백필(기동 시 1회). 목록 백필과 같은 이유로 기본 비활성이다.
ddoksi.collection.summary-backfill.enabled=false

# --- AI 분석 -------------------------------------------------------------------
# Claude API 키. 국회 API 키와 마찬가지로 gitignore 된 .env 에 둔다.
# 비어 있어도 기동은 성공한다 — 분석 배치는 기본 비활성이고 조회·수집은 Claude 없이 동작한다.
ddoksi.analysis.api-key=${ANTHROPIC_API_KEY:}
ddoksi.analysis.model=claude-opus-5

# 배치가 생성할 프롬프트 버전. BillAnalysisPrompt.VERSION 과 같아야 한다.
ddoksi.analysis.prompt-version=v1
# 조회 API 가 읽을 버전. 생성용과 나눠 둔 이유는 전환을 통제하기 위해서다 —
# v2 를 백필하는 동안에도 앱에는 v1 만 보이고, 전량이 채워진 뒤 이 값을 바꾸면
# 화면이 한 번에 넘어간다. 두 값이 같은 것이 평상시 상태다.
ddoksi.analysis.active-prompt-version=v1

# 기본 비활성. 수집 배치들과 같은 이유에 하나가 더 있다 — 호출 한 건이 곧 과금이라
# 모르고 켜두면 로컬 기동만으로도 청구서가 생긴다.
ddoksi.analysis.scheduled.enabled=false
# 매일 04:30. 목록 수집(03:30)과 제안이유 수집(04:00)이 끝난 뒤라야
# 그날 들어온 법안의 분석 입력이 갖춰진다.
ddoksi.analysis.scheduled.cron=0 30 4 * * *
# 정기 실행 1회 상한. 일평균 신규 발의가 23건이라 200이면 여유가 있다.
# 상한의 진짜 목적은 분량이 아니라 하룻밤 비용의 예측 가능성이다.
ddoksi.analysis.scheduled.max-bills=200

# 기동 시 분석 백필. 기본 비활성이며, 상한 기본값도 100으로 둔다 —
# 여기서 상한을 빠뜨리면 19,406건이 전량 호출된다.
ddoksi.analysis.backfill.enabled=false
ddoksi.analysis.backfill.max-bills=100


# --- CORS ---------------------------------------------------------------------
# Expo 웹 개발 서버(8081)에서 API(8080)를 호출할 수 있게 허용한다.
# 운영에서는 실제 도메인으로 교체한다. 와일드카드는 쓰지 않는다.
ddoksi.cors.allowed-origins=http://localhost:8081,http://localhost:19006
