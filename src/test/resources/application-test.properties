# 테스트 전용 설정. @ActiveProfiles("test") 가 붙은 테스트에만 적용된다.
#
# 운영(개발) DB 인 ddoksi 를 건드리지 않기 위해 별도 데이터베이스를 쓴다.
# 수집 배치 테스트는 묶음 단위 커밋이 설계의 핵심이라 롤백으로 감쌀 수 없고,
# 그 결과 테스트가 만든 데이터가 그대로 남는다. 그 데이터가 실수집분과 섞이면
# 나중에 버그인지 테스트 찌꺼기인지 구분할 수 없게 된다.
#
# 최초 1회 준비:
#   createdb -O ddoksi ddoksi_test
# 스키마는 Flyway 가 기동 시 자동으로 만든다.
spring.datasource.url=jdbc:postgresql://localhost:5432/ddoksi_test
spring.datasource.username=${DB_USERNAME:ddoksi}
spring.datasource.password=${DB_PASSWORD:ddoksi}

# 테스트 DB 에서도 스키마의 주인은 Flyway 다. 운영과 같은 마이그레이션을 적용해야
# "운영에서만 나는 문제" 를 테스트가 놓치지 않는다.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# 배치는 테스트가 명시적으로 호출할 때만 돈다. 기동만으로 수집이 시작되면 안 된다.
ddoksi.collection.scheduled.enabled=false
ddoksi.collection.backfill.enabled=false
ddoksi.collection.summary-backfill.enabled=false

# 테스트에서는 국회 API 호출 간격을 줄여 대기 시간을 아낀다.
# 실호출 건수 자체가 적어(한 자릿수~수백 건) 상대에게 부담이 되지 않는다.
assembly.api.request-delay=100ms
